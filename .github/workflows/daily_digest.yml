name: Weekly 40K Digest

on:
  schedule:
    # Every Monday. Off the top of the hour, because GitHub delays (or drops)
    # scheduled jobs queued at :00 by hours. Primary ≈ 00:37 PDT, backup ≈ 06:37 PDT;
    # the backup only runs the pipeline if no digest exists for that day yet.
    - cron: "37 7 * * 1"
    - cron: "37 13 * * 1"

  # Allow manual runs from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write   # needed to commit docs/ back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so we can diff docs/ and push changes
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Skip a backup scheduled run if today's digest already went out ──
      - name: Check for today's digest
        id: guard
        run: |
          # Check the latest main, not just this run's snapshot (a delayed run may be stale)
          git fetch -q origin main
          if [ "${{ github.event_name }}" = "schedule" ] && git cat-file -e "origin/main:docs/data/digest_$(date -u +%F).json" 2>/dev/null; then
            echo "Digest for $(date -u +%F) already exists — skipping this scheduled run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Run the pipeline ──────────────────────────────────────
      - name: Run digest pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          TASTE_PROFILE: ${{ secrets.TASTE_PROFILE }}
          ALERT_THRESHOLD: ${{ secrets.ALERT_THRESHOLD }}
        run: |
          # Keep a copy of the run log in the repo (docs/data/last_run.txt) for debugging
          set -o pipefail
          mkdir -p docs/data
          python -u main.py 2>&1 | tee docs/data/last_run.txt

      # ── 5. Commit updated dashboard back to the repo ─────────────
      - name: Commit dashboard update
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "40K Digest Bot"
          git config user.email "actions@github.com"

          # Stage everything under docs/ (index.html + new JSON data file)
          git add docs/

          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "Nothing changed in docs/ — skipping commit"
          else
            git commit -m "chore: digest update $(date -u '+%Y-%m-%d')"
            git push
          fi
