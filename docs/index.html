<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>40K Content Intelligence Dashboard</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0d0d0d; color: #e8e8e8;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { text-align: center; max-width: 420px; padding: 40px 24px; }
  h1 { font-size: 20px; color: #fff; margin-bottom: 12px; }
  p { font-size: 14px; color: #888; line-height: 1.6; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: #c0392b; margin-right: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
</style>
</head>
<body>
<div class="box">
  <h1>🎖 40K Content Intelligence</h1>
  <p><span class="dot"></span>Waiting for the first pipeline run.</p>
  <p style="margin-top:16px;">The dashboard will appear here after the first daily digest has been generated by GitHub Actions.</p>
</div>
</body>
</html>
